<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Admin se ne indeksira. Isto kaze i zaglavlje X-Robots-Tag u netlify.toml;
     ovo stoji za slucaj da se stranica ikad posluzi negdje drugdje. -->
<meta name="robots" content="noindex, nofollow">
<title>Admin | HES</title>
<link rel="icon" href="/assets/logo/logo-mark-color.png">

<script>
  (function () {
    var tema = null;
    try { tema = localStorage.getItem("hes.tema"); } catch (e) {}
    if (tema !== "tamna" && tema !== "svijetla") {
      var svijetlo = false;
      try { svijetlo = window.matchMedia("(prefers-color-scheme: light)").matches; } catch (e) {}
      tema = svijetlo ? "svijetla" : "tamna";
    }
    document.documentElement.dataset.theme = tema;
  })();
</script>

<link rel="preload" href="/assets/fonts/hes-regrade.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/sekcije.css">
<link rel="stylesheet" href="/css/admin.css">
</head>

<body class="admin">
<!--
  Admin panel. Samo hrvatski, bez kostura i bez animacija: ovo je alat za
  tvrtku, i gustoca podataka ovdje vrijedi vise od dojma.

  Sve sto se vidi nakon prijave crta js/admin/main.js. Kartice u traci su
  poveznice na #upiti, #najam i #artikli, a jedan upit je #upit=<id> — adresa
  koju rubna funkcija salje u mailu tvrtki.

  Prava ne odlucuje ova stranica nego RLS u supabase/shema.sql (je_admin()).
  Tko ovu datoteku otvori bez prijave, ne vidi nista vise od obrasca.
-->
<header class="admin__traka">
  <a class="znak" href="/" aria-label="HES — javna stranica">
    <img class="znak__svijetli" src="/assets/logo/logo-mark-white.png" alt="" width="192" height="193">
    <img class="znak__tamni" src="/assets/logo/logo-mark-color.png" alt="" width="192" height="193">
  </a>
  <nav class="admin__kartice" aria-label="Admin" data-admin-kartice hidden></nav>
  <div class="admin__korisnik" data-admin-korisnik hidden>
    <span class="jedva" data-admin-email></span>
    <button class="gumb gumb--tihi" type="button" data-admin-odjava>Odjava</button>
  </div>
</header>

<main class="admin__sadrzaj stupac" id="sadrzaj">
  <form class="admin__prijava prozor staklo" data-admin-prijava hidden>
    <div class="prozor__traka" aria-hidden="true">
      <span class="prozor__tocka"></span><span class="prozor__tocka"></span><span class="prozor__tocka"></span>
      <span class="prozor__naslov">admin.hes</span>
    </div>
    <h1 class="naslov-3">Prijava</h1>
    <p class="polje-obrasca">
      <label class="polje-obrasca__oznaka" for="admin-email">E-pošta</label>
      <input class="polje-obrasca__ulaz" type="email" id="admin-email" name="email" autocomplete="username" required>
    </p>
    <p class="polje-obrasca">
      <label class="polje-obrasca__oznaka" for="admin-lozinka">Lozinka</label>
      <input class="polje-obrasca__ulaz" type="password" id="admin-lozinka" name="lozinka" autocomplete="current-password" required>
    </p>
    <p class="admin__poruka admin__poruka--greska" data-admin-greska role="alert" hidden></p>
    <button class="gumb gumb--glavni" type="submit">Prijava</button>
  </form>

  <div data-admin-ekran></div>
</main>

<p class="admin__obavijest" data-admin-obavijest role="status" aria-live="polite" hidden></p>

<noscript><p class="stupac">Admin panel treba JavaScript.</p></noscript>

<script type="module" src="/js/admin/main.js"></script>
</body>
</html>
